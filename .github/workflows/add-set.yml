name: Add or refresh a set

on:
  workflow_dispatch:
    inputs:
      set_numbers:
        description: "LEGO set numbers, comma or newline separated (e.g. 10218, 21363, 43031)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-set:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch set data from Rebrickable and write JSON
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          SET_NUMBERS: ${{ inputs.set_numbers }}
        run: node scripts/add-set.mjs

      - name: Commit and push changes
        run: |
          git config user.name "bb-lego-sets bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json parts minifig_parts

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add/update sets: ${{ inputs.set_numbers }}"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (remote moved since checkout) - rebasing and retrying, attempt $attempt"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase hit a real conflict, needs a manual look. Re-run this workflow after checking main."
              exit 1
            fi
          done
          echo "::error::Still couldn't push after 5 attempts"
          exit 1
