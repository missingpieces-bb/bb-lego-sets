<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Missing Piece Selector</title>
<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>
<style>
  :root {
    --border: #d8dce1;
    --text: #23272f;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-bg: #eaf1ff;
    --danger: #b3261e;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    font-size: 14px;
    background: transparent;
  }
  #mp-root { max-width: 640px; }
  .mp-hint { color: var(--muted); padding: 10px 0; }
  .mp-error {
    color: var(--danger);
    background: #fdecea;
    border: 1px solid #f5c2be;
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .mp-confirm {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--accent-bg);
    border: 1px solid #c7dbff;
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .mp-confirm img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 4px; border: 1px solid var(--border); }
  .mp-confirm-text strong { font-weight: 600; }
  .mp-search {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 8px;
  }
  .mp-search:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .mp-count { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .mp-list { max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  .mp-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #eef0f3; }
  .mp-item:last-child { border-bottom: none; }
  .mp-item:hover { background: #f6f8fb; }
  .mp-item.mp-in-cart { background: var(--accent-bg); }
  .mp-item img { width: 40px; height: 40px; object-fit: contain; background: #fff; border: 1px solid var(--border); border-radius: 4px; flex-shrink: 0; }
  .mp-item .mp-thumb-fallback {
    width: 40px; height: 40px; flex-shrink: 0; background: #eef0f3; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); text-align: center;
  }
  .mp-item-text { min-width: 0; flex: 1; }
  .mp-item-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-item-sub { color: var(--muted); font-size: 12px; }
  .mp-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 999px; flex-shrink: 0; }
  .mp-badge-part { background: #eef0f3; color: var(--muted); }
  .mp-badge-minifig { background: #fff1d6; color: #8a5a00; }
  .mp-badge-added { background: var(--accent); color: #fff; }
  .mp-more { color: var(--muted); font-size: 12px; padding: 8px 10px; }

  .mp-cart { margin-top: 14px; }
  .mp-cart-title { font-weight: 600; margin-bottom: 6px; }
  .mp-cart-empty { color: var(--muted); font-size: 12px; }
  .mp-cart-list { max-height: 240px; overflow-y: auto; padding-right: 2px; }
  .mp-cart-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--accent); border-radius: var(--radius); margin-bottom: 6px;
  }
  .mp-cart-row:last-child { margin-bottom: 0; }
  .mp-cart-row img { width: 40px; height: 40px; object-fit: contain; background: #fff; border: 1px solid var(--border); border-radius: 4px; flex-shrink: 0; }
  .mp-cart-row .mp-thumb-fallback { width: 40px; height: 40px; flex-shrink: 0; background: #eef0f3; border-radius: 4px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
  .mp-cart-text { flex: 1; min-width: 0; }
  .mp-cart-text strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-qty-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .mp-qty-wrap label { font-size: 12px; color: var(--muted); }
  .mp-qty-wrap input { width: 56px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
  .mp-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; flex-shrink: 0; }
</style>
</head>
<body>
<div id="mp-root">
  <div class="mp-hint" id="mp-idle">Enter your LEGO set number above to find your piece.</div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- pure logic (mirrors logic.js — inlined so this is a single deployable file) ---------- */
  function normalizeCatalog(data) {
    if (!data || typeof data !== "object") return [];
    var out = [];
    (data.parts || []).forEach(function (p) {
      out.push({ kind: "part", id: p.id, code: p.part_num, name: p.name, color: p.color || null, max_qty: p.max_qty, img: p.img || null, label: p.label });
    });
    (data.minifigs || []).forEach(function (m) {
      out.push({ kind: "minifig", id: m.id, code: m.fig_num, name: m.name, color: null, max_qty: m.max_qty, img: m.img || null, label: m.label });
    });
    return out;
  }
  function filterCatalog(items, query) {
    var q = (query || "").trim().toLowerCase();
    if (!q) return items;
    return items.filter(function (item) {
      return (item.code && item.code.toLowerCase().indexOf(q) !== -1) ||
             (item.name && item.name.toLowerCase().indexOf(q) !== -1) ||
             (item.color && item.color.toLowerCase().indexOf(q) !== -1) ||
             (item.label && item.label.toLowerCase().indexOf(q) !== -1);
    });
  }
  function clampQty(value, maxQty) {
    var n = parseInt(value, 10);
    if (isNaN(n) || n < 1) n = 1;
    var max = parseInt(maxQty, 10);
    if (!isNaN(max) && max > 0 && n > max) n = max;
    return n;
  }
  function cartIndexOf(cart, kind, id) {
    for (var i = 0; i < cart.length; i++) if (cart[i].item.kind === kind && cart[i].item.id === id) return i;
    return -1;
  }
  function toggleCart(cart, item) {
    var idx = cartIndexOf(cart, item.kind, item.id);
    if (idx === -1) return cart.concat([{ item: item, qty: clampQty(1, item.max_qty) }]);
    return cart.slice(0, idx).concat(cart.slice(idx + 1));
  }
  function removeFromCart(cart, kind, id) {
    var idx = cartIndexOf(cart, kind, id);
    if (idx === -1) return cart;
    return cart.slice(0, idx).concat(cart.slice(idx + 1));
  }
  function updateCartQty(cart, kind, id, qty) {
    var idx = cartIndexOf(cart, kind, id);
    if (idx === -1) return cart;
    var entry = cart[idx];
    var updated = { item: entry.item, qty: clampQty(qty, entry.item.max_qty) };
    return cart.slice(0, idx).concat([updated], cart.slice(idx + 1));
  }
  function composeSubmission(args) {
    var setNum = args.setNum, setName = args.setName, cart = args.cart || [];
    if (!setNum || cart.length === 0) return "";
    var lines = ["Set: " + setNum + (setName ? " \u2014 " + setName : ""), ""];
    cart.forEach(function (entry, i) {
      var item = entry.item;
      var itemLine = item.kind === "minifig"
        ? "Minifigure: " + item.code + " \u2014 " + item.name
        : "Part: " + item.code + " \u2014 " + item.name + (item.color ? " (" + item.color + ")" : "");
      lines.push((i + 1) + ") " + itemLine + " \u2014 Qty: " + entry.qty);
    });
    return lines.join("\n");
  }

  /* ---------- widget state ---------- */
  var MAX_RENDERED = 150;
  var state = { setNum: null, setName: null, setImg: null, catalog: [], query: "", cart: [], status: "idle" };
  var root = document.getElementById("mp-root");
  var fetchToken = 0;

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    if (state.status === "idle") {
      root.innerHTML = '<div class="mp-hint">Enter your LEGO set number above to find your piece.</div>';
      return;
    }
    if (state.status === "loading") {
      root.innerHTML = '<div class="mp-hint">Looking up set ' + escapeHtml(state.setNum) + '\u2026</div>';
      return;
    }
    if (state.status === "notfound") {
      root.innerHTML = '<div class="mp-error">We couldn\u2019t find set number \u201c' + escapeHtml(state.setNum) +
        '\u201d in our inventory. Please double-check the number, or contact us if you think this is a mistake.</div>';
      return;
    }
    if (state.status === "error") {
      root.innerHTML = '<div class="mp-error">Something went wrong loading this set\u2019s pieces. Please try again in a moment.</div>';
      return;
    }

    var html = "";
    html += '<div class="mp-confirm">';
    html += state.setImg ? '<img src="' + escapeHtml(state.setImg) + '" alt="" />' : '';
    html += '<div class="mp-confirm-text"><strong>Set:</strong> ' + escapeHtml(state.setNum) + ' \u2014 ' + escapeHtml(state.setName) + '</div>';
    html += '</div>';

    html += '<input type="text" class="mp-search" id="mp-search" placeholder="Search by part number, name, or colour\u2026" value="' + escapeHtml(state.query) + '" />';

    var filtered = filterCatalog(state.catalog, state.query);
    html += '<div class="mp-count">' + filtered.length + ' item' + (filtered.length === 1 ? "" : "s") + ' (parts + minifigures) \u2014 click any item to add it below</div>';

    html += '<div class="mp-list" id="mp-list">';
    var shown = filtered.slice(0, MAX_RENDERED);
    if (shown.length === 0) {
      html += '<div class="mp-more">No matches \u2014 try a different search term.</div>';
    }
    shown.forEach(function (item) {
      var inCart = cartIndexOf(state.cart, item.kind, item.id) !== -1;
      html += '<div class="mp-item' + (inCart ? " mp-in-cart" : "") + '" data-id="' + escapeHtml(item.id) + '" data-kind="' + item.kind + '">';
      html += item.img
        ? '<img src="' + escapeHtml(item.img) + '" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'mp-thumb-fallback\',textContent:\'No photo\'}))" />'
        : '<div class="mp-thumb-fallback">No photo</div>';
      html += '<div class="mp-item-text">';
      html += '<div class="mp-item-title">' + escapeHtml(item.code) + ' \u2014 ' + escapeHtml(item.name) + '</div>';
      html += '<div class="mp-item-sub">' + escapeHtml(item.color || (item.kind === "minifig" ? "Minifigure" : "")) + '</div>';
      html += '</div>';
      html += inCart
        ? '<span class="mp-badge mp-badge-added">Added</span>'
        : '<span class="mp-badge ' + (item.kind === "minifig" ? "mp-badge-minifig" : "mp-badge-part") + '">' + item.kind + '</span>';
      html += '</div>';
    });
    if (filtered.length > MAX_RENDERED) {
      html += '<div class="mp-more">+' + (filtered.length - MAX_RENDERED) + ' more \u2014 keep typing to narrow it down.</div>';
    }
    html += '</div>';

    html += '<div class="mp-cart">';
    html += '<div class="mp-cart-title">Missing pieces (' + state.cart.length + ')</div>';
    if (state.cart.length === 0) {
      html += '<div class="mp-cart-empty">Nothing added yet \u2014 click pieces above to add them here, then set the quantity for each.</div>';
    } else {
      html += '<div class="mp-cart-list" id="mp-cart-list">';
      state.cart.forEach(function (entry) {
        var item = entry.item;
        html += '<div class="mp-cart-row" data-id="' + escapeHtml(item.id) + '" data-kind="' + item.kind + '">';
        html += item.img ? '<img src="' + escapeHtml(item.img) + '" alt="" />' : '<div class="mp-thumb-fallback">No photo</div>';
        html += '<div class="mp-cart-text"><strong>' + escapeHtml(item.code) + ' \u2014 ' + escapeHtml(item.name) + '</strong>' +
          escapeHtml(item.color || (item.kind === "minifig" ? "Minifigure" : "")) + '</div>';
        html += '<div class="mp-qty-wrap"><label>Qty</label><input type="number" class="mp-cart-qty" min="1" max="' +
          (item.max_qty || 1) + '" value="' + entry.qty + '" /></div>';
        html += '<button type="button" class="mp-remove">Remove</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    root.innerHTML = html;

    var searchEl = document.getElementById("mp-search");
    if (searchEl) {
      searchEl.addEventListener("input", function (e) {
        state.query = e.target.value;
        render();
        var s = document.getElementById("mp-search");
        if (s) { s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
      });
    }
    var listEl = document.getElementById("mp-list");
    if (listEl) {
      listEl.querySelectorAll(".mp-item").forEach(function (el) {
        el.addEventListener("click", function () {
          var id = el.getAttribute("data-id"), kind = el.getAttribute("data-kind");
          var item = state.catalog.filter(function (i) { return i.id === id && i.kind === kind; })[0];
          if (!item) return;
          state.cart = toggleCart(state.cart, item);
          render();
          sendCurrentValue();
        });
      });
    }
    root.querySelectorAll(".mp-cart-row").forEach(function (row) {
      var id = row.getAttribute("data-id"), kind = row.getAttribute("data-kind");
      var qtyEl = row.querySelector(".mp-cart-qty");
      var removeEl = row.querySelector(".mp-remove");
      if (qtyEl) {
        qtyEl.addEventListener("change", function (e) {
          state.cart = updateCartQty(state.cart, kind, id, e.target.value);
          render();
          sendCurrentValue();
        });
      }
      if (removeEl) {
        removeEl.addEventListener("click", function () {
          state.cart = removeFromCart(state.cart, kind, id);
          render();
          sendCurrentValue();
        });
      }
    });
  }

  function loadSet(setNum) {
    var token = ++fetchToken;
    state.setNum = setNum;
    state.cart = [];
    state.query = "";
    if (!setNum) {
      state.status = "idle";
      render();
      sendCurrentValue();
      return;
    }
    state.status = "loading";
    render();

    var base = (JFCustomWidget.getWidgetSetting("dataBaseUrl") || "https://missingpieces-bb.github.io/bb-lego-sets/parts/").replace(/\/?$/, "/");
    fetch(base + encodeURIComponent(setNum) + ".json")
      .then(function (res) {
        if (token !== fetchToken) return null;
        if (res.status === 404) { state.status = "notfound"; render(); return null; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || token !== fetchToken) return;
        state.setName = data.set_name || "";
        state.setImg = data.set_img || null;
        state.catalog = normalizeCatalog(data);
        state.status = "ready";
        render();
        sendCurrentValue();
      })
      .catch(function (err) {
        if (token !== fetchToken) return;
        state.status = "error";
        render();
        console.error("Missing piece widget fetch failed:", err);
      });
  }

  function sendCurrentValue() {
    var value = composeSubmission({ setNum: state.setNum, setName: state.setName, cart: state.cart });
    JFCustomWidget.sendData({ valid: !!value, value: value });
  }

  JFCustomWidget.subscribe("ready", function () {
    var fieldId = JFCustomWidget.getWidgetSetting("setNumberFieldId");
    var initial = JFCustomWidget.getWidgetSetting("initialSetNumber") || "";

    if (fieldId) {
      JFCustomWidget.listenFromField("input_" + fieldId, "change", function (value) { loadSet((value || "").trim()); });
      JFCustomWidget.listenFromField("input_" + fieldId, "keyup", function (value) { loadSet((value || "").trim()); });
      JFCustomWidget.getFieldsValueById([fieldId], function (data) {
        var v = data && data[fieldId];
        if (v) loadSet(String(v).trim());
      });
    } else if (initial) {
      loadSet(initial);
    } else {
      render();
    }

    JFCustomWidget.subscribe("submit", function () {
      sendCurrentValue();
      var value = composeSubmission({ setNum: state.setNum, setName: state.setName, cart: state.cart });
      JFCustomWidget.sendSubmit({ valid: !!value, value: value });
    });
  });

  render();
})();
</script>
</body>
</html>
